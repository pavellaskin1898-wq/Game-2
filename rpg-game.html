<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D RPG - Здание Тайн</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 900px;
            height: 700px;
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            border: 4px solid #4a4e69;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        
        #game-canvas {
            display: block;
            border-radius: 6px;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 6px;
        }
        
        #floor-indicator {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #4a4e69;
        }
        
        #stats-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            border: 2px solid #4a4e69;
            text-align: right;
        }
        
        .stat-row {
            margin: 5px 0;
        }
        
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: linear-gradient(180deg, rgba(22,33,62,0.95) 0%, rgba(26,26,46,0.98) 100%);
            border: 3px solid #4a4e69;
            border-radius: 12px;
            padding: 20px;
            display: none;
            pointer-events: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        #speaker-name {
            color: #fca311;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        #dialogue-text {
            color: #e5e5e5;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
            min-height: 60px;
        }
        
        #choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .choice-btn {
            background: linear-gradient(135deg, #4a4e69 0%, #22223b 100%);
            color: #fff;
            border: 2px solid #6c757d;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s ease;
            text-align: left;
        }
        
        .choice-btn:hover {
            background: linear-gradient(135deg, #6c757d 0%, #4a4e69 100%);
            border-color: #fca311;
            transform: translateX(5px);
        }
        
        #message-log {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            color: #aaa;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 300px;
            pointer-events: none;
        }
        
        #ending-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            border-radius: 6px;
            pointer-events: auto;
            z-index: 100;
        }
        
        #ending-title {
            font-size: 42px;
            color: #fca311;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        
        #ending-description {
            font-size: 18px;
            max-width: 70%;
            text-align: center;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #ccc;
        }
        
        #restart-btn {
            background: linear-gradient(135deg, #fca311 0%, #e69500 100%);
            color: #1a1a2e;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        #restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(252,163,17,0.5);
        }
        
        #controls-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: #666;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="900" height="700"></canvas>
        
        <div id="ui-overlay">
            <div id="floor-indicator">Этаж: <span id="current-floor">10</span></div>
            
            <div id="stats-panel">
                <div class="stat-row">❤️ Здоровье: <span id="health-stat">100</span></div>
                <div class="stat-row">💰 Золото: <span id="gold-stat">0</span></div>
                <div class="stat-row">📊 Репутация: <span id="rep-stat">0</span></div>
                <div class="stat-row">🔑 Ключи: <span id="keys-stat">0</span></div>
            </div>
            
            <div id="dialogue-box">
                <div id="speaker-name"></div>
                <div id="dialogue-text"></div>
                <div id="choices-container"></div>
            </div>
            
            <div id="message-log">Добро пожаловать в Здание Тайн!</div>
            
            <div id="controls-hint">WASD/Стрелки - Движение | E - Взаимодействие</div>
        </div>
        
        <div id="ending-screen">
            <div id="ending-title"></div>
            <div id="ending-description"></div>
            <button id="restart-btn">Начать заново</button>
        </div>
    </div>

        // Текущие объекты на этаже

        // Загрузка этажа
        function loadFloor(floorNum) {
            const floor = floorData[floorNum];
            if (!floor) return;
            
            currentPlatforms = floor.platforms.map(p => ({...p}));
            currentNPCs = floor.npcs.map(n => ({...n, talked: false}));
            currentItems = floor.items.map(i => ({...i, collected: false}));
            currentStairs = floor.stairs ? {...floor.stairs} : null;
            currentExit = floor.exit ? {...floor.exit} : null;
            
            // Позиция игрока при входе на этаж
            gameState.player.x = 100;
            gameState.player.y = 580;
            gameState.player.vx = 0;
            gameState.player.vy = 0;
            
            updateUI();
            showMessage(`Прибыли на этаж ${floorNum}: ${floor.name}`);
        }
        
        // Обновление UI
        function updateUI() {
            floorIndicator.textContent = gameState.currentFloor;
            healthStat.textContent = gameState.player.health;
            goldStat.textContent = gameState.player.gold;
            repStat.textContent = gameState.player.reputation;
            keysStat.textContent = gameState.player.keys;
        }
        
        function updateStats() {
            updateUI();
        }
        
        // Сообщение в лог
        function showMessage(text) {
            messageLog.textContent = text;
            setTimeout(() => {
                if (messageLog.textContent === text) {
                    messageLog.textContent = '';
                }
            }, 3000);
        }
        
        // Система диалогов
        let currentDialogue = null;
        let dialogueNode = null;
        
        function startDialogue(npc) {
            if (npc.talked && npc.id !== 'director') return;
            
            currentDialogue = npc;
            dialogueNode = npc.dialogue.start[0];
            
            dialogueBox.style.display = 'block';
            speakerName.textContent = npc.name;
            showDialogueNode(dialogueNode);
        }
        
        function showDialogueNode(node) {
            const text = typeof node.text === 'function' ? node.text() : node.text;
            dialogueText.textContent = text;
            choicesContainer.innerHTML = '';
            
            const choices = typeof node.choices === 'function' ? node.choices() : node.choices;
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.onclick = () => handleChoice(choice);
                choicesContainer.appendChild(btn);
            });
        }
        
        function handleChoice(choice) {
            if (choice.effect) {
                choice.effect();
            }
            
            if (choice.end) {
                closeDialogue();
                if (currentDialogue) {
                    currentDialogue.talked = true;
                }
            } else if (choice.next) {
                const nextNode = choice.next[Math.floor(Math.random() * choice.next.length)] || choice.next[0];
                showDialogueNode(nextNode);
            }
        }
        
        function closeDialogue() {
            dialogueBox.style.display = 'none';
            currentDialogue = null;
            dialogueNode = null;
        }
        
        // Физика и коллизии
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        function updatePhysics() {
            const player = gameState.player;
            
            // Гравитация
            player.vy += 0.8;
            
            // Движение
            player.x += player.vx;
            player.y += player.vy;
            
            // Ограничение по горизонтали
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > CANVAS_WIDTH) player.x = CANVAS_WIDTH - player.width;
            
            // Коллизия с платформами
            let onGround = false;
            for (const platform of currentPlatforms) {
                if (checkCollision(player, platform)) {
                    // Столкновение сверху
                    if (player.vy > 0 && player.y + player.height - player.vy <= platform.y) {
                        player.y = platform.y - player.height;
                        player.vy = 0;
                        onGround = true;
                    }
                    // Столкновение снизу
                    else if (player.vy < 0 && player.y - player.vy >= platform.y + platform.height) {
                        player.y = platform.y + platform.height;
                        player.vy = 0;
                    }
                    // Столкновение сбоку
                    else {
                        if (player.vx > 0) {
                            player.x = platform.x - player.width;
                        } else if (player.vx < 0) {
                            player.x = platform.x + platform.width;
                        }
                        player.vx = 0;
                    }
                }
            }
            
            // Падение ниже пола
            if (player.y > CANVAS_HEIGHT) {
                player.health -= 10;
                player.x = 100;
                player.y = 580;
                player.vy = 0;
                updateStats();
                showMessage("Вы упали! -10 HP");
                
                if (player.health <= 0) {
                    triggerEnding('death');
                }
            }
            
            // Проверка взаимодействия с NPCs
            for (const npc of currentNPCs) {
                const dist = Math.hypot(player.x - npc.x, player.y - npc.y);
                if (dist < 60 && keys['KeyE'] && !dialogueBox.style.display === 'block') {
                    startDialogue(npc);
                }
            }
            
            // Сбор предметов
            for (const item of currentItems) {
                if (!item.collected && checkCollision(player, {x: item.x, y: item.y, width: 20, height: 20})) {
                    item.collected = true;
                    
                    if (item.type === 'gold') {
                        gameState.player.gold += item.value;
                        showMessage(`+${item.value} золотых!`);
                    } else if (item.type === 'potion') {
                        gameState.player.health = Math.min(gameState.player.maxHealth || 100, gameState.player.health + item.value);
                        showMessage(`+${item.value} здоровья!`);
                    } else if (item.type === 'key') {
                        gameState.player.keys++;
                        showMessage("+1 ключ!");
                    }
                    
                    updateStats();
                }
            }
            
            // Лестница на следующий этаж
            if (currentStairs && checkCollision(player, {x: currentStairs.x, y: currentStairs.y, width: 40, height: 50})) {
                if (gameState.currentFloor > 1) {
                    gameState.currentFloor--;
                    loadFloor(gameState.currentFloor);
                }
            }
            
            // Выход с 1 этажа
            if (currentExit && checkCollision(player, currentExit)) {
                triggerEnding('escape');
            }
        }
        
        // Концовки
        function triggerEnding(type) {
            if (gameState.gameOver) return;
            gameState.gameOver = true;
            
            let title, description;
            
            switch(type) {
                case 'clean':
                    title = "Герой Очищения";
                    description = `Вы активировали систему очистки и спасли здание от загрязнения! Ваша репутация: ${gameState.player.reputation}. Золота собрано: ${gameState.player.gold}. Люди будут помнить вас как спасителя!`;
                    break;
                case 'authorized':
                    title = "Авторизованный Выход";
                    description = `Вы получили разрешение директора и покинули здание законным путём. Репутация: ${gameState.player.reputation}. Золото: ${gameState.player.gold}. Ваше путешествие завершено успешно!`;
                    break;
                case 'respected':
                    title = "Уважаемый Гость";
                    description = `Ваша высокая репутация (${gameState.player.reputation}) открыла вам все двери! Вы вышли из здания как почётный гость. Золото: ${gameState.player.gold}. Слава о ваших деяниях разнесётся далеко!`;
                    break;
                case 'escape':
                    title = "Беглец";
                    description = `Вы выбрались из здания, но так и не узнали всей правды... Репутация: ${gameState.player.reputation}. Золото: ${gameState.player.gold}. Может быть, однажды вы вернётесь?`;
                    break;
                case 'death':
                    title = "Конец Пути";
                    description = `Вы погибли в здании, так и не достигнув цели. Собрано золота: ${gameState.player.gold}. Репутация: ${gameState.player.reputation}. Ваша история могла бы сложиться иначе...`;
                    break;
                default:
                    title = "Неизвестная концовка";
                    description = "Что-то пошло не так...";
            }
            
            endingTitle.textContent = title;
            endingDescription.textContent = description;
            endingScreen.style.display = 'flex';
        }
        
        // Отрисовка
        function draw() {
            const floor = floorData[gameState.currentFloor];
            if (!floor) return;
            
            // Фон
            ctx.fillStyle = floor.background;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Платформы
            ctx.fillStyle = '#4a4e69';
            for (const platform of currentPlatforms) {
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                
                // Декор платформы
                ctx.fillStyle = '#6c757d';
                ctx.fillRect(platform.x, platform.y, platform.width, 5);
                ctx.fillStyle = '#4a4e69';
            }
            
            // Лестница
            if (currentStairs) {
                ctx.fillStyle = '#fca311';
                ctx.fillRect(currentStairs.x, currentStairs.y, 40, 50);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText('↓', currentStairs.x + 15, currentStairs.y + 30);
            }
            
            // Выход
            if (currentExit) {
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(currentExit.x, currentExit.y, currentExit.width, currentExit.height);
                ctx.fillStyle = '#fff';
                ctx.font = '14px Arial';
                ctx.fillText('ВЫХОД', currentExit.x - 10, currentExit.y - 10);
            }
            
            // Предметы
            for (const item of currentItems) {
                if (!item.collected) {
                    if (item.type === 'gold') {
                        ctx.fillStyle = '#ffd700';
                        ctx.beginPath();
                        ctx.arc(item.x + 10, item.y + 10, 8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.font = '12px Arial';
                        ctx.fillText('$', item.x + 6, item.y + 14);
                    } else if (item.type === 'potion') {
                        ctx.fillStyle = '#e74c3c';
                        ctx.fillRect(item.x, item.y, 20, 25);
                        ctx.fillStyle = '#fff';
                        ctx.font = '10px Arial';
                        ctx.fillText('+HP', item.x + 2, item.y + 15);
                    } else if (item.type === 'key') {
                        ctx.fillStyle = '#3498db';
                        ctx.beginPath();
                        ctx.arc(item.x + 10, item.y + 10, 10, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.font = '12px Arial';
                        ctx.fillText('🔑', item.x + 5, item.y + 14);
                    }
                }
            }
            
            // NPC
            for (const npc of currentNPCs) {
                ctx.fillStyle = npc.color;
                ctx.fillRect(npc.x, npc.y, npc.width, npc.height);
                
                // Имя NPC
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(npc.name, npc.x + npc.width / 2, npc.y - 10);
                ctx.textAlign = 'left';
                
                // Индикатор взаимодействия
                const dist = Math.hypot(gameState.player.x - npc.x, gameState.player.y - npc.y);
                if (dist < 60) {
                    ctx.fillStyle = '#fca311';
                    ctx.font = '14px Arial';
                    ctx.fillText('[E]', npc.x + npc.width / 2, npc.y - 25);
                }
            }
            
            // Игрок
            const player = gameState.player;
            ctx.fillStyle = '#3498db';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Глаза игрока
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x + 5, player.y + 10, 8, 8);
            ctx.fillRect(player.x + 17, player.y + 10, 8, 8);
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x + 7, player.y + 12, 4, 4);
            ctx.fillRect(player.x + 19, player.y + 12, 4, 4);
        }
        
        // Игровой цикл
        function gameLoop() {
            if (!gameState.gameOver) {
                // Управление
                gameState.player.vx = 0;
                if (keys['KeyA'] || keys['ArrowLeft']) gameState.player.vx = -gameState.player.speed;
                if (keys['KeyD'] || keys['ArrowRight']) gameState.player.vx = gameState.player.speed;
                if ((keys['KeyW'] || keys['ArrowUp']) && gameState.player.vy === 0) {
                    gameState.player.vy = -12;
                }
                
                updatePhysics();
            }
            
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Обработчики событий
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            // Взаимодействие с NPC
            if (e.code === 'KeyE' && !gameState.gameOver) {
                for (const npc of currentNPCs) {
                    const dist = Math.hypot(gameState.player.x - npc.x, gameState.player.y - npc.y);
                    if (dist < 60 && dialogueBox.style.display !== 'block') {
                        startDialogue(npc);
                        break;
                    }
                }
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        restartBtn.addEventListener('click', () => {
            // Сброс игры
            gameState = {
                currentFloor: 10,
                player: {
                    x: 450,
                    y: 600,
                    width: 30,
                    height: 50,
                    health: 100,
                    gold: 0,
                    reputation: 0,
                    keys: 0,
                    speed: 5,
                    vx: 0,
                    vy: 0,
                    maxHealth: 100
                },
                flags: {},
                inventory: [],
                gameOver: false,
                ending: null
            };
            
            endingScreen.style.display = 'none';
            closeDialogue();
            loadFloor(10);
            updateStats();
            showMessage("Игра началась заново!");
        });
        
        // Инициализация
        loadFloor(10);
        updateStats();
        gameLoop();
    </script>
</body>
</html>
